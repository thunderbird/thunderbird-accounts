# yaml-language-server: $schema=https://raw.githubusercontent.com/adorsys/keycloak-config-cli/main/src/main/resources/keycloak-config-cli-import-schema.json
# keycloak-config-cli: audience mapping
#
# Recent changes in Keycloak (26.6.2+) require clients that use another client's token to be in the `aud` claim of that token.
# This is a simple change, but we have to apply it for quite a few clients. The `roles` scope which is a default scope automatically resolves their own audience value,
# so we just need to focus on additional audiences.
#
# A rough map looks like:
# - stalwart : stalwart
# - desktop : stalwart
# - desktop : thunderbird-send-backend
# - ext-fairemail : stalwart
# - mobile-android-k9mail : stalwart
# - mobile-android-thunderbird : stalwart
# - mobile-ios-thunderbird : stalwart
# - thunderbird-accounts : stalwart
# - thunderbird-accounts : thunderbird-accounts
# - thunderbird-appointment-frontend : thunderbird-appointment-backend
# - thunderbird-stormbox : stalwart
realm: tbpro

# Keycloak 26.6.2+ requires the client performing token introspection to be in the
# access token's audience.
clients:
  - clientId: thunderbird-accounts
    protocolMappers:
      - &scope_stalwart_audience
        name: stalwart audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: stalwart
          id.token.claim: "false"
          lightweight.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
      - <<: *scope_stalwart_audience
        name: thunderbird-accounts audience
        config:
          included.client.audience: thunderbird-accounts
          id.token.claim: "false"
          lightweight.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
  - clientId: desktop
    protocolMappers:
      - *scope_stalwart_audience
      - <<: *scope_stalwart_audience
        name: thunderbird send backend audience
        config:
          included.client.audience: thunderbird-send-backend
          id.token.claim: "false"
          lightweight.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
  - clientId: ext-fairemail
    protocolMappers:
      - *scope_stalwart_audience
  - clientId: mobile-android-k9mail
    protocolMappers:
      - *scope_stalwart_audience
  - clientId: mobile-android-thunderbird
    protocolMappers:
      - *scope_stalwart_audience
  - clientId: mobile-ios-thunderbird
    protocolMappers:
      - *scope_stalwart_audience
  - clientId: thunderbird-stormbox
    protocolMappers:
      - *scope_stalwart_audience
  # stalwart: stalwart is needed for mail authentication via user sso, as it normally returns aud: account. 
  - clientId: stalwart
    protocolMappers:
      - *scope_stalwart_audience
  - clientId: thunderbird-appointment-frontend
    protocolMappers:
      - <<: *scope_stalwart_audience
        name: appointment backend audience
        config:
          included.client.audience: thunderbird-appointment-backend
          id.token.claim: "false"
          lightweight.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
