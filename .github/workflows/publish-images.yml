---
name: publish-images

concurrency:
  group: publish-images-${{ github.ref }}
  queue: max

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seed_pair:
        description: Seed the image pair record from the current latest indexes without building images.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # Separate job: decide which image(s) changed and read the version once, so
  # the build jobs below only run for images that actually changed.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      accounts-changed: ${{ steps.check.outputs.accounts-changed }}
      keycloak-changed: ${{ steps.check.outputs.keycloak-changed }}
      version: ${{ steps.read-version.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: check
        if: github.event_name == 'push'
        with:
          filters: |
            accounts-changed:
              - 'assets/**'
              - 'static/**'
              - 'templates/**'
              # The accounts frontend bundle imports the shared keycloak theme
              # via the `@kc` vite alias (-> keycloak/themes/tbpro/assets), so
              # `npm run build` compiles it into the accounts image. Theme edits
              # must therefore rebuild accounts too.
              - 'keycloak/themes/**'
              # The accounts Dockerfile COPYs the whole scripts/ dir.
              - 'scripts/**'
              - 'Dockerfile'
              - 'manage.py'
              - 'MANIFEST.in'
              - 'package.json'
              - 'package-lock.json'
              - 'pyproject.toml'
              - 'README.md'
              - 'src/**'
              - 'uv.lock'
              # Frontend build inputs COPYd by the Dockerfile (note: .mts, plus
              # tsconfig.json and env.d.ts).
              - 'vite.config.mts'
              - 'tsconfig.json'
              - 'env.d.ts'
            keycloak-changed:
              - 'keycloak/**'
              - 'Dockerfile.keycloak'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/entry-keycloak.sh'
              - 'scripts/apply-cli-config.sh'
              - 'scripts/PgAdvisoryLockRun.java'

      - name: Get version from pyproject.toml
        id: read-version
        uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876 # v1.2.0
        with:
          file: 'pyproject.toml'
          field: 'project.version'

  accounts:
    needs: detect-changes
    if: >-
      !inputs.seed_pair &&
      (github.event_name == 'workflow_dispatch' ||
       needs.detect-changes.outputs.accounts-changed == 'true')
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: ghcr.io/thunderbird/thunderbird-accounts
      dockerfile: Dockerfile
      version: ${{ needs.detect-changes.outputs.version }}
      artifact-prefix: accounts

  keycloak:
    needs: detect-changes
    if: >-
      !inputs.seed_pair &&
      (github.event_name == 'workflow_dispatch' ||
       needs.detect-changes.outputs.keycloak-changed == 'true')
    uses: ./.github/workflows/build-multiarch-image.yml
    with:
      image: ghcr.io/thunderbird/thunderbird-accounts-keycloak
      dockerfile: Dockerfile.keycloak
      version: ${{ needs.detect-changes.outputs.version }}
      artifact-prefix: keycloak

  record-pair:
    name: Record image pair
    needs: [detect-changes, accounts, keycloak]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.result == 'success' &&
      (needs.accounts.result == 'success' || needs.accounts.result == 'skipped') &&
      (needs.keycloak.result == 'success' || needs.keycloak.result == 'skipped') &&
      (inputs.seed_pair || needs.accounts.result == 'success' || needs.keycloak.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Publish pair.yaml
        env:
          SEED_PAIR: ${{ inputs.seed_pair == true }}
          VERSION: ${{ needs.detect-changes.outputs.version }}
          ACCOUNTS_RESULT: ${{ needs.accounts.result }}
          ACCOUNTS_DIGEST: ${{ needs.accounts.outputs.digest }}
          KEYCLOAK_RESULT: ${{ needs.keycloak.result }}
          KEYCLOAK_DIGEST: ${{ needs.keycloak.outputs.digest }}
        run: bash .github/scripts/publish-image-pair.sh
