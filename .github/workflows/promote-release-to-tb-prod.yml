---
name: promote-release-to-tb-prod

concurrency:
  group: promote-release-to-tb-prod
  cancel-in-progress: false

on:
  release:
    types:
      - published

permissions: {}

jobs:
  promote-release-to-tb-prod:
    if: vars.KARGO_PROMOTE_TB_PROD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: tb-prod-promote
    permissions:
      contents: read
    env:
      PAIR_REPO_URL: https://github.com/thunderbird/thunderbird-accounts.git
      KARGO_API: https://kargo.pi.thunderbird.net
      KARGO_PROJECT: tb-accounts
      KARGO_STAGE: tb-prod
      KARGO_VERIFIED_IN: tb-stage
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the image pair record for the release commit
        id: resolve
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          fail() {
            local m="$*"
            echo "### $RELEASE_TAG was not promoted to $KARGO_STAGE: $m" >> "$GITHUB_STEP_SUMMARY"
            m=${m//'%'/%25} m=${m//$'\r'/%0D} m=${m//$'\n'/%0A}
            echo "::error::$m"
            exit 1
          }

          [[ "$RELEASE_TAG" =~ ^r-[0-9]{4}$ ]] || fail "release tag $RELEASE_TAG is not r-NNNN"
          [[ "$RELEASE_AUTHOR" == "github-actions[bot]" ]] || fail "release $RELEASE_TAG was not drafted by GitHub Actions"
          [[ "$RELEASE_TARGET" == "$RELEASE_SHA" ]] || fail "release $RELEASE_TAG targets $RELEASE_TARGET, not commit $RELEASE_SHA; publish a draft pinned to a commit (r-0647 or later)"

          record=$(bash .github/scripts/find-release-pair.sh "$RELEASE_SHA" 2>&1) || fail "$record"
          IFS=$'\t' read -r pair_commit accounts_digest keycloak_digest <<< "$record"
          printf '%s\n' "pair-commit=$pair_commit" "accounts-digest=$accounts_digest" \
            "keycloak-digest=$keycloak_digest" >> "$GITHUB_OUTPUT"

      - name: Promote the matching Freight to tb-prod
        env:
          KARGO_TOKEN: ${{ secrets.KARGO_TB_PROD_TOKEN }}
          PAIR_COMMIT: ${{ steps.resolve.outputs.pair-commit }}
          ACCOUNTS_DIGEST: ${{ steps.resolve.outputs.accounts-digest }}
          KEYCLOAK_DIGEST: ${{ steps.resolve.outputs.keycloak-digest }}
          VERIFY_TIMEOUT_SECONDS: "2700"
          PROMOTION_TIMEOUT_SECONDS: "1800"
          POLL_SECONDS: "15"
        run: |
          set -euo pipefail
          promotion=
          fail() {
            local m="$*"
            {
              echo "### $RELEASE_TAG: $KARGO_STAGE promotion failed"
              echo "- $m"
              if [[ -n "$promotion" ]]; then echo "- Promotion: \`$promotion\`"; fi
              echo "- Kargo: $KARGO_API/project/$KARGO_PROJECT"
            } >> "$GITHUB_STEP_SUMMARY"
            m=${m//'%'/%25} m=${m//$'\r'/%0D} m=${m//$'\n'/%0A}
            echo "::error::$m"
            exit 1
          }
          [[ -n "$KARGO_TOKEN" ]] || fail "secret KARGO_TB_PROD_TOKEN is not set in the tb-prod-promote environment"

          umask 077
          auth="$RUNNER_TEMP/kargo-auth" body="$RUNNER_TEMP/kargo-body"
          printf 'Authorization: Bearer %s\n' "$KARGO_TOKEN" > "$auth"
          trap 'rm -f "$auth"' EXIT

          kargo() {
            local method=$1 path=$2 data=${3:-} out status error
            local args=(-sS -X "$method" -o "$body" -w '%{http_code} %header{cf-mitigated}' --max-time 60
              -A thunderbird-accounts-release-promoter -H "@$auth" -H 'Accept: application/json')
            if [[ -n "$data" ]]; then args+=(-H 'Content-Type: application/json' --data-raw "$data"); fi
            if [[ "$method" == GET ]]; then args+=(--retry 4 --retry-connrefused --retry-max-time 300); fi
            out=$(curl "${args[@]}" "$KARGO_API$path") || fail "$method $path: cannot reach $KARGO_API"
            status=${out%% *}
            if [[ -n "${out#* }" ]]; then
              fail "$method $path: Cloudflare challenged this runner (HTTP $status); the request did not reach Kargo, so this is not an auth failure"
            fi
            error=$(jq -r '.error? // empty' "$body" 2>/dev/null || true)
            case "$status" in
              2??) ;;
              401) fail "$method $path: Kargo rejected the token (401 ${error:-no body})" ;;
              *) fail "$method $path: HTTP $status ${error:-with no Kargo error body, so it came from in front of Kargo: $(head -c 300 "$body")}" ;;
            esac
          }

          deadline=$((SECONDS + VERIFY_TIMEOUT_SECONDS))
          while :; do
            kargo GET "/v1beta1/projects/$KARGO_PROJECT/freight"
            freights=$(jq -c --arg repo "$PAIR_REPO_URL" '[.groups[]?.items[]? | {
                name: .metadata.name,
                alias: (.alias // ""),
                at: (.discoveredAt // .metadata.creationTimestamp // ""),
                commits: [.commits[]? | select(.repoURL == $repo) | .id],
                verifiedIn: ((.status.verifiedIn // {}) | keys)
              }]' "$body")
            read -r count freight freight_at verified < <(jq -r --arg commit "$PAIR_COMMIT" --arg s "$KARGO_VERIFIED_IN" \
              'map(select(.commits | index($commit) != null)) | "\(length) \(.[0].name // "-") \(.[0].at // "-") \(.[0].verifiedIn // [] | index($s) != null)"' <<< "$freights")
            if (( count == 1 )) && [[ "$verified" == true ]]; then break; fi
            if (( count > 1 || SECONDS >= deadline )); then
              echo "Wanted: record commit $PAIR_COMMIT. Freight in $KARGO_PROJECT:"
              jq -r '.[] | "  \(.name) (\(.alias)) commits=\(.commits | join(",")) verifiedIn=\(.verifiedIn | join(","))"' <<< "$freights"
              case "$count" in
                0) fail "no Freight with record commit $PAIR_COMMIT after ${VERIFY_TIMEOUT_SECONDS}s; Kargo never discovered it, or deleted its Freight. Nothing was promoted" ;;
                1) fail "Freight $freight is not verified on $KARGO_VERIFIED_IN after ${VERIFY_TIMEOUT_SECONDS}s; nothing was promoted" ;;
                *) fail "found $count Freight with record commit $PAIR_COMMIT, expected one; nothing was promoted" ;;
              esac
            fi
            sleep "$POLL_SECONDS"
          done

          kargo GET "/v1beta1/projects/$KARGO_PROJECT/stages/$KARGO_STAGE"
          current=$(jq -r '[.status.freightHistory[0].items[]?.name][0] // ""' "$body")
          if [[ "$current" == "$freight" ]]; then
            echo "### $RELEASE_TAG: Freight \`$freight\` is already current on $KARGO_STAGE, nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$current" ]]; then
            current_at=$(jq -r --arg n "$current" '.[] | select(.name == $n) | .at' <<< "$freights")
            [[ -n "$current_at" && "$freight_at" > "$current_at" ]] \
              || fail "Freight $freight ($freight_at) is not newer than $KARGO_STAGE's current Freight $current (${current_at:-not in the Freight list}); refusing to move $KARGO_STAGE back. A Kargo admin can do that by hand"
          fi

          kargo GET "/v1beta1/projects/$KARGO_PROJECT/promotions?stage=$KARGO_STAGE"
          unfinished=$(jq -c '[.items[]? | select(.status.phase // "" | IN("Succeeded", "Failed", "Errored", "Aborted") | not)
            | {name: .metadata.name, freight: .spec.freight, phase: (.status.phase // "Pending")}]' "$body")
          others=$(jq -r --arg f "$freight" 'map(select(.freight != $f) | "\(.name) (Freight \(.freight), \(.phase))") | join(", ")' <<< "$unfinished")
          [[ -z "$others" ]] || fail "$KARGO_STAGE has unfinished Promotions: $others; nothing was promoted. Re-run when they end, or a Kargo admin can abort them"
          promotion=$(jq -r --arg f "$freight" 'map(select(.freight == $f)) | .[0].name // empty' <<< "$unfinished")
          if [[ -n "$promotion" ]]; then
            echo "Promotion $promotion of Freight $freight is already queued on $KARGO_STAGE; waiting for it"
          else
            kargo POST "/v1beta1/projects/$KARGO_PROJECT/stages/$KARGO_STAGE/promotions" "$(jq -nc --arg f "$freight" '{freight: $f}')"
            promotion=$(jq -r '.metadata.name' "$body")
          fi
          printf '%s\n' "### Promoting $RELEASE_TAG to $KARGO_STAGE" "- Freight: \`$freight\`" "- Accounts: \`$ACCOUNTS_DIGEST\`" \
            "- Keycloak: \`$KEYCLOAK_DIGEST\`" "- Promotion: \`$promotion\`" >> "$GITHUB_STEP_SUMMARY"

          deadline=$((SECONDS + PROMOTION_TIMEOUT_SECONDS))
          while :; do
            sleep "$POLL_SECONDS"
            kargo GET "/v1beta1/projects/$KARGO_PROJECT/promotions/$promotion"
            phase=$(jq -r '.status.phase // "Pending"' "$body")
            if [[ "$phase" =~ ^(Succeeded|Failed|Errored|Aborted)$ ]] || (( SECONDS >= deadline )); then break; fi
          done
          case "$phase" in
            Succeeded) result=Succeeded ;;
            Failed | Errored | Aborted) result="$phase: $(jq -r '.status.message // ""' "$body")" ;;
            *) result="still $phase after ${PROMOTION_TIMEOUT_SECONDS}s: queued or running; a Kargo admin can abort it at $KARGO_API/project/$KARGO_PROJECT" ;;
          esac
          echo "- Result: $result" >> "$GITHUB_STEP_SUMMARY"
          [[ "$phase" == Succeeded ]] || fail "Promotion $promotion: $result"
          echo "Promotion $promotion of Freight $freight to $KARGO_STAGE succeeded"
