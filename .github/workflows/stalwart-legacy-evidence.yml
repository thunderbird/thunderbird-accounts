name: Stalwart legacy delete_dkim evidence (#1270)

on:
  workflow_dispatch:
  push:
    branches:
      - research/issue-1270
  pull_request:
    paths:
      - '.github/workflows/stalwart-legacy-evidence.yml'
      - 'src/thunderbird_accounts/mail/clients/mail_client_legacy.py'
      - 'src/thunderbird_accounts/mail/tests/test_stalwart_legacy_integration.py'

permissions:
  contents: read

jobs:
  delete-dkim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start docker-compose
        run: docker compose up -d --build -V postgres redis accounts stalwart_legacy

      # A fresh Stalwart v0.15 container generates an admin password and prints it on first boot
      - name: Wait for Stalwart
        run: |
          for i in $(seq 1 60); do
            password=$(docker compose logs stalwart_legacy 2>&1 | sed -nE "s/.*administrator account is 'admin' with password '([^']+)'.*/\1/p" | tail -1)
            if [ -n "$password" ] && curl -sf -o /dev/null -u "admin:$password" "http://localhost:8080/api/settings/list?prefix=signature"; then
              echo "::add-mask::$password"
              echo "STALWART_API_AUTH_STRING=$(printf 'admin:%s' "$password" | base64)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker compose logs stalwart_legacy
          exit 1

      - name: Run delete_dkim against Stalwart
        run: |
          docker compose exec -T \
            -e STALWART_LEGACY_INTEGRATION=1 \
            -e STALWART_API_AUTH_STRING="$STALWART_API_AUTH_STRING" \
            -e STALWART_EVIDENCE_FILE=/tmp/stalwart-1270-evidence.txt \
            accounts bash -c 'uv run python manage.py test thunderbird_accounts.mail.tests.test_stalwart_legacy_integration -v 2'

      - name: Print evidence
        if: always()
        run: docker compose exec -T accounts cat /tmp/stalwart-1270-evidence.txt
